[package]
name = "egui-async"
version = "0.7.0"
edition = "2024"
description = "A simple library for running async tasks in egui and binding their results to your UI."
authors = ["Cody Wyatt Neiman (xangelix) <neiman@cody.to>"]
categories = ["gui", "asynchronous", "wasm", "concurrency", "web-programming"]
keywords = ["egui", "async", "future", "gui", "ui"]
repository = "https://github.com/xangelix/egui-async"
documentation = "https://docs.rs/egui-async"
readme = "README.md"
license = "MIT OR Apache-2.0"

[features]
default = ["egui"]
egui = ["dep:egui"]

[[example]]
name = "advanced"
required-features = ["egui"]

[[example]]
name = "login"
required-features = ["egui"]

[[example]]
name = "periodic"
required-features = ["egui"]

[[example]]
name = "simple"
required-features = ["egui"]

[[example]]
name = "widgets"
required-features = ["egui"]

[lints.clippy]
todo = "deny"
panic = "deny"
unwrap_used = "deny"

[dependencies]
atomic_float = "1"
tracing = "0.1"
bitflags = "2"

egui = { version = "0.36", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", default-features = false, features = [
    "sync",
    "rt-multi-thread",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen-futures = "0.4"

# Only used by the examples, which are native apps. Several of these do not build for
# wasm32-unknown-unknown without extra configuration, which would block the WASM tests.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
eframe = "0.36"
reqwest = { version = "0.13", features = ["json"] }
rand = "0.10"
serde_json = "1"
walkers = "0.60"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
